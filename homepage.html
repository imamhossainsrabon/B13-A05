<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="hompage.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="./assets/github-logo.png" alt="GitHub Logo">
                <h2>GitHub Issues Tracker</h2>
            </div>

            <div class="search-box">
                <div class="searchIcon">
                    <input type="search" id="search" placeholder="Search issues...">
                    <i class="fa-solid fa-magnifying-glass search"></i>
                </div>

                <button class="newIssue">+ New Issue</button>
            </div>
        </div>
    </header>

    <main>
        <div class="btns" id="filter-btns">
            <button onclick="filteredBtn('all')" class="active" id="all">All</button>
            <button onclick="filteredBtn('open')" class="inactive" id="open">Open</button>
            <button onclick="filteredBtn('closed')" class="inactive" id="closed">Closed</button>
        </div>

        <div class="issueBox">
            <div class="issue">
                <div>
                    <div>
                        <img src="./assets/Group 1.png" alt="">
                    </div>

                    <div>
                        <h2><span id="issueCount">0</span> Issues</h2>
                        <p>Track and manage your project issues</p>
                    </div>
                </div>
            </div>

            <div class="blocks">
                <div>
                    <div><img src="./assets/green.png" alt=""></div>
                    <p>Open</p>
                </div>
                <div>
                    <div><img src="./assets/purple.png" alt=""></div>
                    <p>Closed</p>
                </div>
            </div>
        </div>
        <div id="loader" class="text-center hidden">
            <span class="loading loading-spinner loading-xs"></span>
        </div>
        <div class="issueCards" id="issueCardContainer"></div>
    </main>


    <dialog id="issue_modal" class="modal">
        <div class="modal-box custom-modal-box">
            <div id="modalContent">

            </div>

            <div class="modal-action">
                <form method="dialog">
                    <button class="close-btn">Close</button>
                </form>
            </div>
        </div>
    </dialog>

    <script src="./script.js"></script>
</body>

</html>
